name: Publish

# Pushing a version tag publishes it: X.Y.Z is a release (also announced on r/DeadditApp),
# X.Y.Z-preview-N a preview. The tag is the version; .github/scripts/compute-version.sh prints the next one.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-preview-[0-9]+'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version and channel from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=release
          elif [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview-[0-9]+$ ]]; then
            channel=preview
          else
            echo "::error::$TAG is not X.Y.Z or X.Y.Z-preview-N"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Release builds only from main
        if: steps.version.outputs.channel == 'release'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag ${{ github.ref_name }} is not on main"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The NDK the app's Gradle build names (r28c), also used to link Reddit.Api natively.
      - name: Install Android NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      # Reddit.Api, compiled with NativeAOT into libredditapi.so for each ABI the app ships.
      - name: Build native Reddit.Api
        run: |
          # ANDROID_HOME is the runner's environment, not the workflow's env context: set it here.
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          for abi in arm64-v8a x86_64; do
            native/publish-android.sh "$abi" "$RUNNER_TEMP/native/$abi"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$RUNNER_TEMP/native/$abi/libredditapi.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deaddit.keystore"

      - name: Build signed APK
        env:
          DEADDIT_KEYSTORE: ${{ runner.temp }}/deaddit.keystore
          DEADDIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEADDIT_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEADDIT_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :core:test :app:assembleRelease -PdeadditVersion=${{ steps.version.outputs.version }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/deaddit.keystore"

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          mv app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/out/Deaddit-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          if [ "$CHANNEL" = release ]; then
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --verify-tag --title "Release $VERSION" --notes "Automated Release" --latest
          else
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --verify-tag --title "Preview $VERSION" --notes "Preview Release" --prerelease --latest=false
          fi

      - name: Announce on r/DeadditApp
        if: steps.version.outputs.channel == 'release'
        shell: pwsh
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: .github/scripts/post-release.ps1 -Version '${{ steps.version.outputs.version }}'
