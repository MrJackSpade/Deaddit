name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - preview
          - release
        default: preview

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Release builds only from main
        if: inputs.channel == 'release' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release builds must run from main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: .github/scripts/compute-version.sh "$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The NDK the app's Gradle build names (r28c), also used to link Reddit.Api natively.
      - name: Install Android NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      # Reddit.Api, compiled with NativeAOT into libredditapi.so for each ABI the app ships.
      - name: Build native Reddit.Api
        run: |
          # ANDROID_HOME is the runner's environment, not the workflow's env context: set it here.
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          for abi in arm64-v8a x86_64; do
            native/publish-android.sh "$abi" "$RUNNER_TEMP/native/$abi"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$RUNNER_TEMP/native/$abi/libredditapi.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deaddit.keystore"

      - name: Build signed APK
        env:
          DEADDIT_KEYSTORE: ${{ runner.temp }}/deaddit.keystore
          DEADDIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEADDIT_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEADDIT_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :core:test :app:assembleRelease -PdeadditVersion=${{ steps.version.outputs.version }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/deaddit.keystore"

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          mv app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/out/Deaddit-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = release ]; then
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --target "$GITHUB_SHA" --title "Release $VERSION" --notes "Automated Release" --latest
          else
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --target "$GITHUB_SHA" --title "Preview $VERSION" --notes "Preview Release" --prerelease --latest=false
          fi

      - name: Announce on r/DeadditApp
        if: inputs.channel == 'release'
        shell: pwsh
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: .github/scripts/post-release.ps1 -Version '${{ steps.version.outputs.version }}'
