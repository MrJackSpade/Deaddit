name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - preview
          - release
        default: preview

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Release builds only from main
        if: inputs.channel == 'release' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release builds must run from main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: .github/scripts/compute-version.sh "$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android dependencies
        run: dotnet build Deaddit/Deaddit.csproj -f net10.0-android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deaddit.keystore"

      - name: Build signed APK
        env:
          DEADDIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DEADDIT_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEADDIT_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet build Deaddit/Deaddit.csproj -f net10.0-android -c Release
          --artifacts-path "$RUNNER_TEMP/build"
          -p:DeadditVersion=${{ steps.version.outputs.version }}
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/deaddit.keystore"
          -p:AndroidSigningKeyAlias="$DEADDIT_KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:DEADDIT_KEY_PASS
          -p:AndroidSigningStorePass=env:DEADDIT_STORE_PASS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/deaddit.keystore"

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          mv "$RUNNER_TEMP/build/bin/Deaddit/release_net10.0-android/com.companyname.deaddit-Signed.apk" \
             "$RUNNER_TEMP/out/Deaddit-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = release ]; then
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --target "$GITHUB_SHA" --title "Release $VERSION" --notes "Automated Release" --latest
          else
            gh release create "$VERSION" "$RUNNER_TEMP/out/Deaddit-$VERSION.apk" \
              --target "$GITHUB_SHA" --title "Preview $VERSION" --notes "Preview Release" --prerelease --latest=false
          fi

      - name: Announce on r/DeadditApp
        if: inputs.channel == 'release'
        shell: pwsh
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: .github/scripts/post-release.ps1 -Version '${{ steps.version.outputs.version }}'
